server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker, workbox runtime and web manifest must stay fresh.
  # If they're cached "immutable", a stale service worker keeps trying to
  # precache asset hashes from an old build -> bad-precaching-response 404s.
  # These are listed before the generic asset rule so they win the match.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
  location ~* ^/workbox-.*\.js$ {
    add_header Cache-Control "no-cache";
  }

  # Content-hashed build assets (and static media) are safe to cache forever.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
